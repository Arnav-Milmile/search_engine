<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>arXiv Paper Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">arXiv Paper Search</a>
      <span id="corpus-count" class="corpus-count">Loading index…</span>
    </header>

    <main>
      <section class="search-section" aria-labelledby="page-title">
        <h1 id="page-title">Search research papers</h1>
        <p>Find arXiv papers by title or abstract.</p>

        <form id="search-form" class="search-form">
          <label class="sr-only" for="query">Search papers</label>
          <input id="query" name="q" type="search" maxlength="300" autocomplete="off"
            placeholder="For example: graph neural networks">
          <button type="submit">Search</button>
        </form>

        <div class="filters">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">All categories</option>
          </select>
          <label for="limit">Results</label>
          <select id="limit" name="limit">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
        </div>
      </section>

      <section class="results-section" aria-live="polite" aria-busy="false">
        <div class="results-heading">
          <h2 id="results-title">Search the collection</h2>
          <span id="results-count" class="results-count"></span>
        </div>
        <div id="message" class="message">
          <span>Enter a topic or phrase to see matching papers.</span>
        </div>
        <div id="results" class="results-list"></div>
      </section>
    </main>

    <footer>Results are ranked with TF-IDF and cosine similarity. Paper links open on arXiv.</footer>
  </body>
</html>
